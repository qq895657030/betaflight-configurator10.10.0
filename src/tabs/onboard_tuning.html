<!-- onboard_tuning.html  -->
<div class="tab-onboard_tuning">
    <div class="content_wrapper">
        <h1>板载调参 (Onboard Tuning)</h1>
        
        <div class="note">
            <p>恭喜！这个页面已经成功加载了。</p>
        </div>

        <!-- 原有的 JS 测试区 -->
        <div style="margin-top: 20px; padding: 20px; background: #eee; border: 1px solid #ccc;">
            <h3>1. 本地 JS 测试：</h3>
            <button id="test_btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
                点我测试 JS 是否生效
            </button>
            <p id="test_result" style="color: red; font-weight: bold; margin-top: 10px;"></p>
        </div>

        <!-- 新增的 MSP 测试区 -->
        <div style="margin-top: 20px; padding: 20px; background: #e3f2fd; border: 1px solid #2196f3;">
            <h3>2. 飞控 MSP 通信测试：</h3>
            <p style="font-size: 14px; color: #555;">点击按钮将发送 <code>MSP_API_VERSION</code> 命令读取飞控版本信息。</p>
            
            <button id="msp_read_btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #2196f3; color: white; border: none; border-radius: 4px;">
                📡 读取飞控版本 (Read API Version)
            </button>
            
            <div id="msp_result" style="margin-top: 15px; padding: 10px; background: white; border: 1px dashed #2196f3; min-height: 40px; font-family: monospace;">
                等待操作...
            </div>
        </div>

        <div style="margin-top:20px; padding:20px; background:#fff3e0; border:1px solid #ff9800;">
            <h3>3. 500Hz 实时调试：</h3>

            <label style="font-size:16px;">
                <input type="checkbox" id="loop_stream_enable">
                启用 500Hz MSP_S_LOOP 数据流
            </label>

            <div id="loop_stream_result"
                style="margin-top:15px;
                        padding:10px;
                        background:black;
                        color:#00ff00;
                        font-family:monospace;
                        min-height:40px;">
                未启动
            </div>
        </div>
    </div>
    
    <div class="content_toolbar">
        <div class="btn save_btn">
            <a class="save" href="#">保存 (Save)</a>
        </div>
    </div>
</div>
